<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
</head>
<body>

<h1>Produtos</h1>

<!-- LISTA -->
<table border="1">
    <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Qtd</th>
        <th>Ação</th>
    </tr>

    <tr th:each="p, stat : ${products}">
        <td th:text="${stat.index}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.quantity}"></td>
        <td>
            <form th:action="@{/products/delete}" method="post">
                <input type="hidden" name="index" th:value="${stat.index}">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>

<hr/>

<!-- CREATE -->
<h2>Novo Produto</h2>
<form th:action="@{/products/create}" method="post">
    Nome: <input type="text" name="name" required><br/>
    Preço: <input type="number" step="0.01" name="price" required><br/>
    Quantidade: <input type="number" name="quantity" required><br/>
    <button type="submit">Salvar</button>
</form>

<br/>
<a th:href="@{/}">Voltar</a>

</body>
</html>
