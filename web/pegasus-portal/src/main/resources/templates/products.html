<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>

    <style>
        body { margin:0; font-family:Arial; background:#f8fafc; }
        header, footer { background:#1e293b; color:#fff; padding:15px; }
        main { padding:20px; }

        table { width:100%; border-collapse:collapse; background:#fff; }
        th, td { border:1px solid #d1d5db; padding:4px 8px; font-size:14px; }
        th { background:#e5e7eb; }

        button { padding:6px 12px; cursor:pointer; }

        .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .card { background:#fff; padding:15px; border:1px solid #e5e7eb; }

        .search-row { display:flex; gap:10px; }

        .pagination {
            margin-top:12px;
            display:flex;
            justify-content:center;
            gap:10px;
            align-items:center;
        }

        .pagination a, .pagination span {
            padding:4px 10px;
            border:1px solid #d1d5db;
            text-decoration:none;
            color:#1e293b;
            background:#fff;
        }

        .pagination span {
            background:#e5e7eb;
            font-weight:bold;
        }

        .search-table {
            width:100%;
            border-collapse:collapse;
            margin-top:10px;
        }

        .search-table th, .search-table td {
            border:1px solid #d1d5db;
            padding:6px;
        }

        .search-table th { background:#f1f5f9; }

        .search-table input {
            width:100%;
            padding:4px;
        }

        .actions {
            display:flex;
            gap:10px;
            margin-top:10px;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>

    <h1>Produtos</h1>

    <!-- ===== TABELA DE PRODUTOS ===== -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Qtd</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pageResponse.products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.quantity}"></td>
            <td>
                <form th:action="@{/products/delete}" method="post">
                    <input type="hidden" name="id" th:value="${p.id}">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- ===== PAGINAÇÃO (HTML CONTROLA size=6) ===== -->
    <div class="pagination">

        <a th:if="${pageResponse.pagination.previous}"
           th:href="@{/products(
                page=${pageResponse.pagination.page - 1},
                size=6
           )}">
            ◀ Anterior
        </a>

        <span>
            Página <span th:text="${pageResponse.pagination.page + 1}"></span>
            de <span th:text="${pageResponse.pagination.pages}"></span>
        </span>

        <a th:if="${pageResponse.pagination.next}"
           th:href="@{/products(
                page=${pageResponse.pagination.page + 1},
                size=6
           )}">
            Próxima ▶
        </a>

    </div>

    <hr>

    <div class="grid">

        <!-- ===== BUSCAR / EDITAR ===== -->
        <div class="card">
            <h2>Buscar Produto</h2>

            <form method="get" th:action="@{/products/search}">
                <div class="search-row">
                    <input type="number" name="id" placeholder="ID" required>
                    <input type="hidden" name="page" value="0">
                    <input type="hidden" name="size" value="6">
                    <button>Buscar</button>
                </div>
            </form>

            <form th:if="${selectedProduct != null}"
                  th:action="@{/products/update}" method="post">

                <input type="hidden" name="id" th:value="${selectedProduct.id}">

                <table class="search-table">
                    <thead>
                    <tr>
                        <th>Campo</th>
                        <th>Atual</th>
                        <th>Novo</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>ID</td>
                        <td th:text="${selectedProduct.id}"></td>
                        <td><input th:value="${selectedProduct.id}" disabled></td>
                    </tr>
                    <tr>
                        <td>Nome</td>
                        <td th:text="${selectedProduct.name}"></td>
                        <td><input name="name" th:value="${selectedProduct.name}"></td>
                    </tr>
                    <tr>
                        <td>Preço</td>
                        <td th:text="${selectedProduct.price}"></td>
                        <td>
                            <input type="number" step="0.01"
                                   name="price"
                                   th:value="${selectedProduct.price}">
                        </td>
                    </tr>
                    <tr>
                        <td>Quantidade</td>
                        <td th:text="${selectedProduct.quantity}"></td>
                        <td>
                            <input type="number"
                                   name="quantity"
                                   th:value="${selectedProduct.quantity}">
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="actions">
                    <button type="submit">Atualizar</button>
                </div>
            </form>

            <form th:if="${selectedProduct != null}"
                  th:action="@{/products/delete}" method="post">
                <input type="hidden" name="id" th:value="${selectedProduct.id}">
                <button type="submit">Excluir</button>
            </form>
        </div>

        <!-- ===== NOVO ===== -->
        <div class="card">
            <h2>Novo Produto</h2>

            <form th:action="@{/products/create}" method="post">
                <input name="name" placeholder="Nome" required><br><br>
                <input type="number" step="0.01" name="price" placeholder="Preço"><br><br>
                <input type="number" name="quantity" placeholder="Quantidade"><br><br>
                <button>Cadastrar</button>
            </form>
        </div>

    </div>

</main>

<!--<div th:replace="fragments/footer :: footer"></div>-->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
