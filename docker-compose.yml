services:

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - pegasus-api-products
      - service-b

  pegasus-portal:
    build: ./web/pegasus-portal
    ports:
      - "8081:8080"
    depends_on:
      - gateway

  front-b:
    build: ./web/front-b
    ports:
      - "8082:8080"
    depends_on:
      - gateway

  pegasus-api-products:
    build: ./api/pegasus-api-products
    ports:
      - "8083:8080"

  service-b:
    build: ./api/service-b
    ports:
      - "8084:8080"
