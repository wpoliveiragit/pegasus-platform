services:

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - service-a
      - service-b

  pegasus-portal:
    build: ./fronts/pegasus-portal
    ports:
      - "8081:8080"
    depends_on:
      - gateway

  front-b:
    build: ./fronts/front-b
    ports:
      - "8082:8080"
    depends_on:
      - gateway

  service-a:
    build: ./services/service-a
    ports:
      - "8083:8080"

  service-b:
    build: ./services/service-b
    ports:
      - "8084:8080"
